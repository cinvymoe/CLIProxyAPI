services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        HTTP_PROXY: ${HTTP_PROXY:-http://172.17.0.1:7890}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://172.17.0.1:7890}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      TZ: Asia/Shanghai
      DEPLOY: ${DEPLOY:-}
      HTTP_PROXY: http://192.168.110.78:7890
      HTTPS_PROXY: http://192.168.110.78:7890
      ALL_PROXY: socks5h://192.168.110.78:7890
      NO_PROXY: localhost,127.0.0.1,::1
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
    networks:
      - cpa-net

  cpa-manager-plus:
    build:
      context: ${CPA_MANAGER_CONTEXT:-../CPA-Manager-Plus}
      dockerfile: Dockerfile.manager-server
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    restart: unless-stopped
    depends_on:
      cli-proxy-api:
        condition: service_started
    ports:
      - "18317:18317"
    environment:
      TZ: Asia/Shanghai
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_DATA_KEY_PATH: "/data/data.key"
      # CPA upstream — uses Docker internal network hostname
      CPA_UPSTREAM_URL: "http://cli-proxy-api:8317"
      # Management key must match the plaintext secret-key in CPA's config.yaml
      CPA_MANAGEMENT_KEY: "${CPA_MANAGEMENT_KEY:-ssw111111}"
      # Admin key for Manager's own login (omit to auto-generate on first start)
      CPA_MANAGER_ADMIN_KEY: "${CPA_MANAGER_ADMIN_KEY:-}"
      USAGE_COLLECTOR_MODE: "auto"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "*"
    volumes:
      - cpa-manager-plus-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - cpa-net

networks:
  cpa-net:
    driver: bridge

volumes:
  cpa-manager-plus-data:
